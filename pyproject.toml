[project]
name = "headroom"
version = "0.1.0"
description = "Queue LLM requests against Vertex AI Provisioned Throughput, gated by capacity and time windows."
readme = "README.md"
authors = [
    { name = "Ted Zhao", email = "ted.zhao.au@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "saq[postgres]>=0.25",
    "psycopg[binary]>=3.2",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "litellm>=1.52",
    "google-cloud-monitoring>=2.22",
    "google-auth>=2.35",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
]

[project.scripts]
headroom-api = "headroom.main:run"
headroom-worker = "headroom.queue.worker:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "testcontainers[postgres]>=4.8",
    "freezegun>=1.5",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"
